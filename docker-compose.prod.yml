version: '3.9'

# Production compose — Nginx runs on the VPS host (not in Docker).
# Frontend is mapped to port 8080 so host Nginx can proxy to it.
# Postgres and Redis are NOT exposed to the host network.

services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      UPLOADS_PATH: /app/uploads
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: 3000
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"   # only reachable from localhost (Nginx proxies /api)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:8080:80"     # only reachable from localhost (Nginx proxies /)
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aipm
      POSTGRES_USER: aipm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port — only reachable inside Docker network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipm_user -d aipm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    # No host port — only reachable inside Docker network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uploads:
  pgdata:
  redisdata:
